worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    proxy_read_timeout 60s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    merge_slashes on;

    # Todas as decisoes de /api/auth usam o URI NORMALIZADO ($uri: decodificado, sem barras duplicadas e sem
    # segmentos ./..) comparado ao literal recebido ($request_uri). A API so entende o caminho normalizado; qualquer
    # forma nao canonica de /api/auth e recusada aqui (400) e a canonica passa pelo limite por IP, em qualquer location.
    map $uri $auth_normalized {
        ~^/api/auth(/|$) 1;
        default 0;
    }
    map $request_uri $auth_literal {
        ~^/api/auth(/|\?|$) 1;
        default 0;
    }
    map "$auth_normalized$auth_literal" $auth_state {
        10 bad;
        11 auth;
        default "";
    }
    map $auth_state $auth_limit_key {
        auth $binary_remote_addr;
        default "";
    }
    map $uri $api_limit_key {
        ~^/api/ $binary_remote_addr;
        default "";
    }

    # imutavel so quando o arquivo existe (200/304): um 404 em /assets/ nao pode ficar em cache por um ano
    map $status $assets_cache_control {
        200 "public, max-age=31536000, immutable";
        304 "public, max-age=31536000, immutable";
        default "";
    }

    limit_req_zone $auth_limit_key zone=auth:10m rate=5r/s;
    limit_req_zone $api_limit_key zone=api:10m rate=30r/s;
    limit_req_status 429;

    include /tmp/nginx-conf/real_ip.conf;
    include /tmp/nginx-conf/*.server.conf;
}
