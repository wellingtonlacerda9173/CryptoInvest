root /usr/share/nginx/html;
index index.html;

# Variacoes nao canonicas de /api/auth (//, %2f, %61, ./..) nunca chegam a API; o limite por IP vale em todo /api/.
# As chaves sao avaliadas ANTES do rewrite dos locations (que troca $uri) e ficam em cache na requisicao.
set $auth_state_pinned $auth_state;
set $auth_key_pinned $auth_limit_key;
set $api_key_pinned $api_limit_key;
if ($auth_state_pinned = bad) {
    return 400;
}
limit_req zone=auth burst=20 nodelay;
limit_req zone=api burst=60 nodelay;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location = /api/ws {
    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    include /etc/nginx/snippets/proxy.conf;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
}

location /api/ {
    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    include /etc/nginx/snippets/proxy.conf;
}

location /assets/ {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control $assets_cache_control always;
    try_files $uri =404;
}

location / {
    include /etc/nginx/snippets/headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
