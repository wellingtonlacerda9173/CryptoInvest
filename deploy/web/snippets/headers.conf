# Hashes: docs/spa-csp-e-mock.md (script anti-flash e <style> inline do dist/index.html). Qualquer edicao
# do web/index.html os muda; a build da imagem (check-dist.mjs) falha se deixarem de bater.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-6g9Yr4Z5uQLOKYFWnN3z0UaPj+qslZDOMIpfzLFIiaU='; style-src 'self' 'sha256-8kvkwELjYxqgmcCymBgnwPIUNqW7QGz4P6+5470rI0g='; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://$server_name; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
