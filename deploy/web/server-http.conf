server {
    listen 8080 default_server;
    server_name _;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 444;
    }
}

server {
    listen 8080;
    server_name ${PANEL_DOMAIN};
    include /etc/nginx/snippets/locations.conf;
}
